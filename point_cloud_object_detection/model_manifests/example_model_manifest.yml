schema_version: "1.0"
model_name: "pbod_example"
precision: "fp32"
device: "cuda"
preprocessing:
  max_num_points: 75000
  num_point_features: 1
  point_cloud_range:
    x: [-50.0, 50.0]
    y: [-50.0, 50.0]
    z: [-2.0, 3.0]
  voxel_size:
    x: 0.2
    y: 0.2
    z: 0.2
  point_features_normalization:
    type: intensity_threshold
    intensity_threshold: 100.0
    epsilon: 1e-6
postprocessing:
  grid_size:
    x: 512
    y: 512
  num_classes: 3
  class_names: ["vehicle", "pedestrian", "cyclist"]
  nms_iou_threshold: 0.2
  score_threshold: [0.5, 0.3, 0.3]
  max_detections: 200
model:
  stride: [2, 1, 2]
  up_stride: [1, 1, 2]
  first_up_stride: 1
  pillar_map_size: [500, 500]
  pillar_map_range: [[-50.0, 50.0], [-50.0, 50.0], [-2.0, 3.0]]
  mask_is_bool: true
  zero_intensity: false
triton:
  model_name: "pbod_triton_fp32"
  model_version: "1"
  precision: "fp32"
