# ===== SLIKAF =================================================================

# ----- DATA -------------------------------------------------------------------

input-training: nuscenes/lidar_cam#train#point_cloud,image_front
label-training: nuscenes/lidar_cam#train#objects,sample_token
# max-samples-training: 1000
# every-nth-sample-training:

input-validation: nuscenes/lidar_cam#valid#point_cloud,image_front
label-validation: nuscenes/lidar_cam#valid#objects,sample_token
# max-samples-validation: 50
# every-nth-sample-validation:

input-testing: nuscenes/lidar_cam#valid#point_cloud,image_front
label-testing: nuscenes/lidar_cam#valid#objects,sample_token
# max-samples-testing:
# every-nth-sample-testing:

padded-batch: False

# ----- Training ---------------------------------------------------------------

# optimizer:
learning-rate: 3e-5
epochs: 70
batch-size: 6

# model-weights:
# model-weights-epoch:

# random-seed:
# deterministic-ops: False
# no-cache: False
# shuffle-buffer-size: 300
no-augment: False

# tune: False

# devices:
# profile-batch: 0

no-mixed-precision: True
no-xla: False

# ----- CALLBACKS --------------------------------------------------------------

# monitor-metric: val_loss
# monitor-mode:
# evaluation-metrics: []

#early-stopping-patience: 10

#learning-rate-plateau-decay-factor: 1.0
#learning-rate-plateau-patience-epochs: 5

learning-rate-schedule-decay-factor: -0.01
learning-rate-schedule-delay-epochs: 0

# output-directory: models/%Y-%m-%d_%H-%M-%S
checkpoint-interval: 5
num-samples-tensorboard: 5
# predict-to-tensorboard: False


# ===== APPLICATION ============================================================

# velocity prediction
with_velocity: False

# inputs and labels
intensity_threshold: 255

label_class_names: [unknown, vehicle, pedestrian, sign, cyclist]
predicted_class_names: [vehicle, pedestrian, cyclist]
background_class_id: -1

# grid
x_min: -50.0
x_max:  50.0
y_min: -50.0
y_max:  50.0
z_min:  -2.0
z_max:   3.00
x_grid_size: 512
y_grid_size: 512

# filter points reflected at sensor
origin_filter_radius: 0

# postprocessing
nms_score_threshold: [0.5, 0.3, 0.3] # thresholds for high nds score
nms_iou_threshold: 0.2
nms_max_num_objects: 200

# augmentation
min_rotation_angle: -20
max_rotation_angle: 20
# noise_std_factor:
# random_point_removal_ratio:
# random_point_removal_probability:
# min_points_per_object:

# ----- PBOD Parameters --------------------------------------------------------+

cylinder_view_grid_size: [1800, 32, 1]
max_num_points: 200000
filter_factor: 2
stride: [2, 1, 2]
up_stride: [1, 1, 2]
# use a finer output resolution with the following
# stride and up_stride. This increases memory
# and more computations, but can better detect
# small objects, e.g. pedestrians
# stride: [1, 2, 2]
# up_stride: [1, 2, 4]

# focal loss
alpha: 0.25
gamma: 2.0

# class loss
class_weights: 0.25 # one global alpha or one per predicted class
class_gamma: 4.0

# reg loss
reg_weight: 0.75

# vehicles
size_prior: # [l, w, h]
  pedestrian: [0.72, 0.66, 1.75]
  bicycle: [1.6, 0.6, 1.27]
  motorcycle: [2.0, 0.76, 1.44]
  car:  [4.6, 2.0, 1.8]
  truck: [6.73, 2.45, 2.73]
  trailer: [12.0, 2.87, 3.81]
  bus: [12.0, 3.0, 3.0]
  construction_vehicle: [6.38, 2.73, 3.13]
  traffic_cone: [0.4, 0.4, 1.06]
  barrier: [2.5, 0.48, 1.0]


# pedestrian
#size_prior: [0.6, 0.8, 1.8]
#stride: [1, 2, 2]
#up_stride: [1, 2, 4]
