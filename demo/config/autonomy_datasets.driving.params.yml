/**/*:
  ros__parameters:
    dataset: driving
    dataset_split: night # Options: day, dusk, night, or all. Each split contains the splits named before it due to the way the data was uploaded by its authors.
    driving_auto_download: true
    driving_download_workers: 8 # Increasing this value may speed up the download of the dataset, but will also increase the load on your computer.
    driving_rosbag_duration_seconds: 20.0

    publish_ego_data: false
    publish_camera_images: false
    publish_lidar_pointclouds: true
    publish_lidar_object_lists: true
