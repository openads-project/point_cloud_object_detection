x-ros-common-env: &ros_common_env
  RMW_IMPLEMENTATION: rmw_fastrtps_cpp

x-gpu-reservation: &gpu_reservation
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: -1
          capabilities: [gpu]

services:
  triton-server:
    image: nvcr.io/nvidia/tritonserver:26.01-py3
    deploy:
      <<: *gpu_reservation
    ipc: shareable
    shm_size: "1gb"
    environment:
      <<: *ros_common_env
      CUDA_VISIBLE_DEVICES: "0"
    volumes:
      - ./models:/models:ro
    command: >
      tritonserver
      --model-repository=/models
      --grpc-port=8001
      --http-port=8000
      --metrics-port=8002
      --log-verbose=0
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8001"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 120s

  point-cloud-object-detection:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest_grids_ci-amd64
    depends_on:
      triton-server:
        condition: service_healthy
    ipc: "service:triton-server"
    environment:
      <<: *ros_common_env
      CUDA_VISIBLE_DEVICES: "0"
    deploy:
      <<: *gpu_reservation
    volumes:
      - ./point_cloud_object_detection.demo.params.yml:/docker-ros/ws/install/point_cloud_object_detection/share/point_cloud_object_detection/config/params.yml:ro
      - ./models:/models:ro
    command: >
      bash -lc "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      name:=point_cloud_object_detection
      point_cloud_topic:=/demo/points
      object_list_topic:=/demo/objects
      no_detection_zone_topic:=/demo/no_detection_zone
      no_detection_zone_points_topic:=/demo/no_detection_zone_points
      detection_area_topic:=/demo/detection_area
      model_bounds_topic:=/demo/model_bounds
      density_grid_map_topic:=/demo/density_grid_map
      occupancy_grid_map_topic:=/demo/occupancy_grid_map
      combined_grid_map_topic:=/demo/combined_grid_map
      static_grid_map_topic:=/demo/static_grid_map
      log_level:=info
      use_sim_time:=false
      "

  pcd-publisher:
    build:
      context: ./pcd-publisher
    depends_on: [point-cloud-object-detection]
    environment:
      <<: *ros_common_env
      PCD_DIR: /data
      PCD_GLOB: "*.pcd"
      PCD_TOPIC: /demo/points
      PCD_FRAME_ID: base_link
      PCD_PUBLISH_RATE_HZ: 1.0
    volumes:
      - ./data:/data:ro
      - ./pcd-publisher/pcd_publisher.py:/opt/demo/pcd_publisher.py:ro

  rviz:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/monitoring/ros-monitoring:v1.0.0
    depends_on: [point-cloud-object-detection]
    environment:
      <<: *ros_common_env
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
    deploy:
      <<: *gpu_reservation
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./rviz/config.rviz:/root/.rviz2/config.rviz
    command: bash -lc "rviz2 -d /root/.rviz2/config.rviz --ros-args -r __node:=rviz"

  ros-parameter-gui:
    image: gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/monitoring/ros-monitoring:v1.0.0
    depends_on: [rviz]
    environment:
      <<: *ros_common_env
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash -lc "rqt --standalone rqt_reconfigure --ros-args -r __node:=ros_parameter_gui"
