include:
  - oci://ghcr.io/openads-project/point_cloud_object_detection/compose:v3.1.1
  - oci://ghcr.io/thinking-cars/autonomy_datasets/compose:v1.7.0

x-model-mount: &model_mount
  type: image
  source: ${MODEL_IMAGE:-ghcr.io/openads-project/point_cloud_object_detection/model:v1.0.0}
  target: /models
  read_only: true
  image:
    subpath: models

services:

  ## DETECTION ##

  triton-server:
    extends:
      file: ./docker-compose.template.yml
      service: triton-server
    ipc: shareable
    shm_size: 1gb
    volumes:
      - *model_mount

  point-cloud-object-detection:
    extends:
      file: ./docker-compose.template.yml
      service: ros2-gpu-service
    depends_on:
      triton-server:
        condition: service_healthy
    ipc: "service:triton-server"
    environment:
      NAME: demo
      PARAMS: /params.yml
      POINT_CLOUD_TOPIC: /lidar_01/point_cloud
    volumes:
      - ./config/point_cloud_object_detection.${DATASET}.params.yml:/params.yml:ro
      - *model_mount

  ## VISUALIZATION ##

  visualization-sync:
    extends:
      file: ./docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/openads-project/monitoring:v1.0.0
    volumes:
      - ./services/visualization-sync/synchronize_detections.py:/opt/demo/synchronize_detections.py:ro
    command: >
      python3 /opt/demo/synchronize_detections.py --ros-args
      -p use_sim_time:=true
      -p cache_size:=32
      -r point_cloud:=/lidar_01/point_cloud
      -r auxiliary_point_cloud:=/demo/no_detection_zone_points
      -r object_list:=/demo/object_list
      -r ground_truth_object_list:=/object_list/lidar_01
      -r density_grid_map:=/demo/density_grid_map
      -r dynamic_grid_map:=/demo/dynamic_grid_map
      -r combined_grid_map:=/demo/combined_grid_map
      -r static_grid_map:=/demo/static_grid_map
      -r synchronized_point_cloud:=/demo/synchronized_point_cloud
      -r synchronized_auxiliary_point_cloud:=/demo/synchronized_no_detection_zone_points
      -r synchronized_object_list:=/demo/synchronized_objects
      -r synchronized_ground_truth_object_list:=/demo/synchronized_ground_truth_objects
      -r synchronized_density_grid_map:=/demo/synchronized_density_grid_map
      -r synchronized_dynamic_grid_map:=/demo/synchronized_dynamic_grid_map
      -r synchronized_combined_grid_map:=/demo/synchronized_combined_grid_map
      -r synchronized_static_grid_map:=/demo/synchronized_static_grid_map

  grid-map-image-republisher:
    extends:
      file: ./docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/openads-project/monitoring:v1.0.0
    depends_on:
      visualization-sync:
        condition: service_started
    volumes:
      - ./services/grid-map-image-republisher/republish_grid_maps_as_images.py:/opt/demo/republish_grid_maps_as_images.py:ro
    command: >
      python3 /opt/demo/republish_grid_maps_as_images.py --ros-args
      -p use_sim_time:=true
      -r density_grid_map:=/demo/synchronized_density_grid_map
      -r dynamic_grid_map:=/demo/synchronized_dynamic_grid_map
      -r combined_grid_map:=/demo/synchronized_combined_grid_map
      -r static_grid_map:=/demo/synchronized_static_grid_map
      -r density_grid_map_image:=/demo/synchronized_density_grid_map_image
      -r dynamic_grid_map_image:=/demo/synchronized_dynamic_grid_map_image
      -r combined_grid_map_image:=/demo/synchronized_combined_grid_map_image
      -r static_grid_map_image:=/demo/synchronized_static_grid_map_image

  ros-parameter-gui:
    extends:
      file: ./docker-compose.template.yml
      service: ros2-x11-service
    image: ghcr.io/openads-project/monitoring:v1.0.0
    command: bash -lc "rqt --standalone rqt_reconfigure --ros-args -r __node:=ros_parameter_gui"

  rviz:
    extends:
      file: ./docker-compose.template.yml
      service: ros2-x11-service
    image: ghcr.io/openads-project/monitoring:v1.0.0
    depends_on:
      point-cloud-object-detection:
        condition: service_started
      visualization-sync:
        condition: service_started
      grid-map-image-republisher:
        condition: service_started
    volumes:
      - ./rviz/config.${DATASET}.rviz:/config.rviz
    command: >
      bash -lc "
        if [ "${DATASET}" = pcd ]; then
            rviz2 -d /config.rviz --ros-args -r __node:=rviz -p use_sim_time:=false;
        else
            rviz2 -d /config.rviz --ros-args -r __node:=rviz -p use_sim_time:=true;
        fi
      "

  ## TEST DATA ##

  autonomy-datasets:
    profiles: [driving, nvidia_physicalai_av_dataset]
    extends:
      file: ./docker-compose.template.yml
      service: ros2-service
    environment:
      CONFIG: /params.yml
      CONTINUE: false
      DATASET: ${DATASET}
      RVIZ: no
      TARGET_FRAME_RATE: "1.0"
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ${DATASET_DIR:-./data/datasets}:/datasets
      - ./config/autonomy_datasets.${DATASET}.params.yml:/params.yml:ro
    image: ghcr.io/thinking-cars/autonomy_datasets:latest_fix-deps_ci  # TODO: remove once released

  pcd-publisher:
    profiles: [pcd]
    extends:
      file: ./docker-compose.template.yml
      service: ros2-service
    image: ghcr.io/openads-project/point_cloud_object_detection/pcd-publisher:v1.0.0-slim
    depends_on:
      point-cloud-object-detection:
        condition: service_started
    environment:
      PCD_DIR: /pcds
      PCD_GLOB: "*.pcd"
      PCD_TOPIC: /lidar_01/point_cloud
      PCD_FRAME_ID: base_link
      PCD_PUBLISH_RATE_HZ: ${PCD_PUBLISH_RATE_HZ:-5.0}
