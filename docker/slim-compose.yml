x-model-mount: &model_mount
  type: image
  source: ${MODEL_IMAGE:-ghcr.io/openads-project/point_cloud_object_detection-model:v1.0.0}
  target: /models
  read_only: true
  image:
    subpath: models

services:
  point-cloud-object-detection:
    # Target the current CI image, or use FAT_IMAGE as an explicit override.
    image: ${FAT_IMAGE:-ghcr.io/openads-project/point_cloud_object_detection:latest}
    volumes:
      - *model_mount
      - ${SLIM_WORKSPACE:-..}/docker/slim-probe.params.yml:/params.yml:ro
    command: >
      bash -lc "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      params:=/params.yml
      log_level:=info
      use_sim_time:=false
      "
