services:
  point-cloud-object-detection:
    # Mint overrides this image in CI via --target-compose-svc-image ${FAT_IMAGE}.
    # The default value keeps the compose file meaningful for manual/local use, too.
    image: ${POINT_CLOUD_OBJECT_DETECTION_IMAGE:-gitlab.ika.rwth-aachen.de:5050/fb-fi/its-modules/perception/point_cloud_object_detection:latest_optimizations_ci-amd64}
    volumes:
      - ../demo/models:/models:ro
      - ./slim-probe.params.yml:/params.yml:ro
    command: >
      bash -lc "
      ros2 launch point_cloud_object_detection point_cloud_object_detection.launch.py
      params:=/params.yml
      log_level:=info
      use_sim_time:=false
      "
